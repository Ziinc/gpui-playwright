[package]
name = "tauri-todo"
description = "The to-do example hosted in a Tauri window through tauri-plugin-gpui, driven by stock Playwright."
publish = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Standalone, so Tauri and its system libraries stay out of the main workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gpui-kit = { version = "=0.7.3", default-features = false, features = ["component", "assets"] }
gpui-playwright = { path = "../../crates/server", features = ["evaluate"] }
tauri = { version = "2.12", features = ["unstable"] }
# The tauri-gpui branch on gpui-pre =0.3.9, the snapshot gpui-kit 0.7.3 uses.
tauri-plugin-gpui = { git = "https://github.com/ziinc/tauri-gpui", branch = "claude/project-thread-h8aiom" }
todo = { path = "../todo" }

# Same gpui-kit as the main workspace (see its Cargo.toml).
[patch.crates-io]
gpui-kit = { git = "https://github.com/Ziinc/gpui-kit", rev = "7ea1125954e6701d849fd448aab08ab2ac63d07f" }
gpui-base = { git = "https://github.com/Ziinc/gpui-kit", rev = "7ea1125954e6701d849fd448aab08ab2ac63d07f" }
gpui-component = { git = "https://github.com/Ziinc/gpui-kit", rev = "7ea1125954e6701d849fd448aab08ab2ac63d07f" }
gpui-component-macros = { git = "https://github.com/Ziinc/gpui-kit", rev = "7ea1125954e6701d849fd448aab08ab2ac63d07f" }
gpui-kit-assets = { git = "https://github.com/Ziinc/gpui-kit", rev = "7ea1125954e6701d849fd448aab08ab2ac63d07f" }
