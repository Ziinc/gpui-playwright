name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy -p gpui-playwright --all-targets --no-default-features -- -D warnings
      # Packaging drops `[patch]`, so this builds against gpui-kit from
      # crates.io, as `cargo publish` does.
      - run: cargo package -p gpui-playwright-selectors -p gpui-playwright

  e2e:
    name: e2e (Playwright ${{ matrix.playwright }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every client minor in transport::SUPPORTED_MINORS.
        playwright: ["1.58.2", "1.59.1", "1.60.0", "1.61.1", "1.62.1", "1.63.0", "1.64.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI runtime, Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev \
            xvfb mesa-vulkan-drivers fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p todo
      - run: npm ci
        working-directory: e2e
      - name: Use Playwright ${{ matrix.playwright }}
        if: matrix.playwright != '1.64.1'
        run: npm install --no-save @playwright/test@${{ matrix.playwright }}
        working-directory: e2e
      - name: Playwright suite without a display (headless GPUI)
        run: npx playwright test
        working-directory: e2e
        env:
          CI: "1"
      - name: Playwright suite on Xvfb (with screenshots)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test
        working-directory: e2e
        env:
          CI: "1"
      - name: Chaos run (protocol abuse, connection churn, random UI walk)
        if: matrix.playwright == '1.64.1'
        run: |
          GPUI_PLAYWRIGHT=9333 xvfb-run -a -s "-screen 0 1920x1080x24" ../target/debug/todo &
          for i in $(seq 60); do curl -sf http://127.0.0.1:9333/ && break; sleep 2; done
          node chaos/chaos.js --seed ${{ github.run_number }} --steps 300
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.playwright }}
          path: |
            e2e/playwright-report
            e2e/test-results

  # The same suite against the to-do app in a Tauri window (tauri-plugin-gpui).
  e2e-tauri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri and GPUI dependencies, Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev \
            xvfb mesa-vulkan-drivers fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --check
        working-directory: examples/tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: examples/tauri
      - run: cargo build
        working-directory: examples/tauri
      - run: npm ci
        working-directory: e2e
      - name: Playwright suite on Xvfb
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test
        working-directory: e2e
        env:
          CI: "1"
          GPUI_PLAYWRIGHT_APP: tauri
      - name: Chaos run
        run: |
          GPUI_PLAYWRIGHT=9333 xvfb-run -a -s "-screen 0 1920x1080x24" ../examples/tauri/target/debug/tauri-todo &
          for i in $(seq 60); do curl -sf http://127.0.0.1:9333/ && break; sleep 2; done
          node chaos/chaos.js --seed ${{ github.run_number }} --steps 300
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-tauri
          path: |
            e2e/playwright-report
            e2e/test-results
