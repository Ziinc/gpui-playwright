[package]
name = "gpui-playwright"
description = "A Playwright protocol server inside GPUI apps: drive them with stock Playwright clients."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gpui.workspace = true
# `test-support` turns on gpui-base's element observation, and gpui-component's
# matching support when the app enables components.
gpui-kit = { workspace = true, default-features = false, features = ["test-support"] }
gpui-playwright-selectors.workspace = true
serde_json.workspace = true
regex.workspace = true
async-channel = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
tungstenite = "0.26"
rquickjs = { version = "0.14", optional = true }

[features]
# `page.evaluate`, `locator.evaluate`, `waitForFunction` and
# `Server::expose_function`, run by an embedded QuickJS.
evaluate = ["dep:rquickjs"]
# Painted text (`getByText` on labels and inline text), placeholders, titles
# and alt text. Needs gpui-kit's text observation, which is not in a gpui-kit
# release yet: patch gpui-kit to the Ziinc/gpui-kit fork (see the README).
painted-text = []

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
raw-window-handle = "0.6"
x11rb = { version = "0.13", default-features = false }
